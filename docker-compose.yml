
services:
  # Redis - In-Memory Distributed Lock & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: flashgrid-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # MongoDB - Permanent Document Storage
  mongo:
    image: mongo:7
    container_name: flashgrid-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  redis-data:
  mongo-data:
